[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-canopy"
version = "0.2.0"
description = "Visible urban tree-canopy coverage from Google Street View imagery."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Juan Oliveira de Carvalho" },
]
dependencies = [
  "joblib>=1.5",
  "numpy>=2.0",
  "opencv-python>=4.10",
  # pydantic-settings 2.0.0 itself requires Pydantic >=2.0.1.
  "pydantic>=2.0.1",
  "pydantic-settings>=2.0",
  "requests>=2.32.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "black>=25.1.0",
  "hypothesis>=6.100",
  "httpx>=0.27",  # fastapi.testclient
  "pyright>=1.1.390",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
notebooks = [
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
  "matplotlib>=3.9",
  # 03_report_figures.ipynb tabulates measurements and emits LaTeX tables.
  "pandas>=2.0",
]
ml = [
  "pillow>=10.0",
  "torch",
  "torchvision",
  "transformers>=4.49",
  # No module here imports scipy, so this looks removable and is not:
  # OneFormerForUniversalSegmentation.__init__ unconditionally builds
  # OneFormerHungarianMatcher, whose first statement is
  # requires_backends(self, ["scipy"]). That matcher only matters for training,
  # but it is constructed at load time, so from_pretrained raises without scipy
  # before any inference runs.
  "scipy",
]

[project.urls]
Repository = "https://github.com/juanocv/urban_canopy"

[project.scripts]
tree-ai = "urban_canopy.cli.main:main"
tree-ai-diagnostics = "urban_canopy.diagnostics:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["urban_canopy*"]
exclude = ["urban_canopy.tests*"]

[tool.pytest.ini_options]
testpaths = ["urban_canopy/tests"]
python_files = ["test_*.py"]
# The default suite must stay offline, CPU-only and free of model downloads.
# Run the excluded checks explicitly with `pytest -m gpu` / `pytest -m network`.
addopts = "-q -m 'not gpu and not network'"
markers = [
  "gpu: requires GPU or heavyweight ML model downloads",
  "network: requires external API access",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["urban_canopy"]

[tool.ruff.lint]
select = ["E9", "F", "B", "I", "NPY", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# set_seed() intentionally seeds NumPy's process-global legacy RNG for callers
# that still consume it. New stochastic code should use Generator explicitly.
"urban_canopy/core/config.py" = ["NPY002"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = [
  "urban_canopy/__init__.py",
  "urban_canopy/core",
  "urban_canopy/evaluation",
  "urban_canopy/io",
  "urban_canopy/models/backend_settings.py",
  "urban_canopy/models/base.py",
  "urban_canopy/models/taxonomy.py",
  "urban_canopy/processing",
  "urban_canopy/validation.py",
  "urban_canopy/webapi.py",
]
exclude = ["urban_canopy/tests"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.coverage.run]
branch = true
source = ["urban_canopy"]
omit = [
  "urban_canopy/tests/*",
  # Environment-reporting executable, not part of the scientific contracts.
  "urban_canopy/diagnostics.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
